# CharlieGPT v2 config. Secrets (DISCORD_TOKEN, INSTAGRAM_USERNAME, INSTAGRAM_PASSWORD) go in .env.

identity:
  name: Charlie
  aliases: [charlie]            # mentioning any of these in a group chat triggers a reply
  discord_user_ids: ["395199310104363009"]   # your Discord user id(s) or username(s)
  instagram_name: charlie       # your display name exactly as it appears in the Instagram export
  contacts: {}                  # "+15551234567": "Alex"   overrides the vCard
  contacts_vcf: null            # default: first *.vcf in data/messages

paths:
  # raw exports, one folder per source
  messages: data/messages       # imessage-exporter HTML + contacts .vcf
  discord: data/discord         # DiscordChatExporter JSON
  instagram: data/instagram     # unzipped Instagram export
  # uniform-format output
  processed: features
  dataset: data/dataset
  memory: data/memory
  captions: data/memory/captions.json
  models: models
  state: state
  media: data/media

dataset:
  session_gap_hours: 6
  burst_gap_minutes: 5
  history_turns: 12
  max_context_chars: 6000
  rag_k: 3
  rag_dropout: 0.3
  val_fraction: 0.03

model:
  train_base: unsloth/Qwen3-14B-unsloth-bnb-4bit   # QLoRA on the 3090
  serve_base: Qwen/Qwen3-14B-AWQ                   # vLLM base; the LoRA is applied on top
  served_base_name: qwen3-14b
  mlx_base: mlx-community/Qwen3-8B-4bit            # Mac training/serving (18GB RAM friendly)
  adapter_name: charlie
  adapter: latest                                  # training run to serve: latest, or a name from `charliegpt models`
  max_seq_length: 4096

train:
  lora_r: 32
  lora_alpha: 32
  learning_rate: 1.0e-4
  epochs: 2
  batch_size: 2
  grad_accum: 8
  mlx_iters: 1000

inference:
  base_url: http://localhost:8000/v1   # on the Mac, point this at the Ubuntu box (LAN/Tailscale IP)
  fallback_url: null                   # e.g. http://localhost:8080/v1 for a local mlx_lm.server
  persona_model: charlie
  helper_model: qwen3-14b
  temperature: 0.8
  top_p: 0.95
  max_tokens: 200
  gpu_memory_utilization: 0.70         # leaves room for the vision server on the same 3090

vision:
  backend: openai                      # openai (vLLM vision server) | local | none
  base_url: http://localhost:8001/v1
  model: Qwen/Qwen2.5-VL-3B-Instruct-AWQ

rag:
  enabled: true
  embed_model: BAAI/bge-small-en-v1.5

bots:
  reply_to_all_dms: true
  reply_in_groups_when_mentioned: true
  ignore_chats: []              # never reply here: names, numbers, emails, chat titles
  only_chats: []                # if set, reply ONLY here, e.g. ["+15551234567"] for one person
  debounce_seconds: 8
  typing_chars_per_second: 7
  takeover_minutes: 30
  dry_run: false

discord:
  owner_user_id: null

imessage:
  db_path: ~/Library/Messages/chat.db
  poll_seconds: 2

instagram:
  i_understand_this_violates_tos: false   # demo only; the bot refuses to start unless true

guardrails:
  commitment_excuses: true       # plans/money/favors get an absurd excuse instead of a yes
  excuse_random_words: 2         # each excuse must use N random English nouns/verbs (0 = model's choice)
  excuse_examples:               # tone references, never reused verbatim
    - sorry i cant i have to ride my horse into the sunset
    - i want to but the king of atlantis has sent me on a quest
  fallback_excuses:              # if generation fails
    - cant the council of geese has summoned me
    - i would but im legally required to guard a lighthouse that day
    - no can do my horse is riding me into the sunset this time
    - sorry the king of atlantis moved my quest up
    - cant im getting knighted by a raccoon
  ai_leak_filter: true           # regenerate/drop replies that sound like a bot, or say "y" to "are you an ai"
  no_repeats: true               # regenerate replies identical to one of the last 3 (stops "y" loops)
  no_brushoffs: true             # regenerate "hi" / "what" / "huh" when they asked a question
  no_refusals: true              # regenerate "im not saying that" / "my phone isnt working" / "sensitive topic"
  deflect_ai_questions: true     # "are you an ai" -> a short brush-off when the model can't stay in character
  deflections: ["lmao what", "bro what 💀", "what are you on", "huh", "no?? 💀"]
