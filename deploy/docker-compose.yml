# Ubuntu + RTX 3090:  docker compose -f deploy/docker-compose.yml up -d
# Needs Docker + the NVIDIA Container Toolkit. Train first so ../models/charlie-latest exists.
# Serve an older run with: ADAPTER=charlie-2026-11-15_14-32-05 docker compose -f deploy/docker-compose.yml up -d
name: charliegpt

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  ipc: host
  restart: unless-stopped
  env_file: ../.env
  volumes:
    - ~/.cache/huggingface:/root/.cache/huggingface
    - ../models:/models:ro

services:
  # Persona model: Qwen3-14B (AWQ) + your LoRA, OpenAI-compatible on :8000.
  # Model names: "charlie" (the fine-tune) and "qwen3-14b" (plain base, used for helper tasks).
  inference:
    <<: *gpu
    image: vllm/vllm-openai:v0.11.0
    ports: ["8000:8000"]
    command: >
      --model Qwen/Qwen3-14B-AWQ --served-model-name qwen3-14b
      --max-model-len 8192 --gpu-memory-utilization 0.70
      --enable-lora --max-lora-rank 32 --lora-modules charlie=/models/${ADAPTER:-charlie-latest}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40

  # Image captioner on :8001 (shares the 3090: 0.70 + 0.20 of VRAM).
  vision:
    <<: *gpu
    image: vllm/vllm-openai:v0.11.0
    ports: ["8001:8000"]
    command: >
      --model Qwen/Qwen2.5-VL-3B-Instruct-AWQ
      --max-model-len 4096 --gpu-memory-utilization 0.20
      --limit-mm-per-prompt '{"image":1}' --mm-processor-kwargs '{"max_pixels":1003520}'
    depends_on:
      inference: { condition: service_healthy }  # start after the big one claims its memory

  discord-bot:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["bot", "discord"]
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../configs:/app/configs:ro
      - ../data:/app/data
      - ../features:/app/features
      - ../state:/app/state       # kill switch lives here: `charliegpt pause` on the host stops it
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      inference: { condition: service_healthy }

  # Demo only (violates Instagram ToS). Starts only with: --profile demo
  instagram-bot:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["bot", "instagram"]
    profiles: [demo]
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../configs:/app/configs:ro
      - ../data:/app/data
      - ../features:/app/features
      - ../state:/app/state
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      inference: { condition: service_healthy }
