[project]
name = "charliegpt"
version = "2.0.0"
description = "Turn your message history into a fine-tuned LLM that texts like you, plus bots that run it."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Retrieval + embeddings (needed by dataset building and the bots)
rag = ["sentence-transformers>=3.0"]
# Local image captioning (only needed if vision.backend == "local")
vision = [
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "transformers>=4.49; sys_platform == 'linux'",
    "torch>=2.4; sys_platform == 'linux'",
    "accelerate>=0.33; sys_platform == 'linux'",
    "mlx-vlm>=0.1.20; sys_platform == 'darwin'",
]
# RTX 3090 training + serving (Ubuntu)
cuda = [
    "unsloth>=2025.6.1; sys_platform == 'linux'",
    "trl>=0.18; sys_platform == 'linux'",
    "datasets>=3.0; sys_platform == 'linux'",
    "vllm>=0.9; sys_platform == 'linux'",
]
# Apple Silicon training + serving
mlx = ["mlx-lm>=0.24; sys_platform == 'darwin'"]
discord = ["discord.py>=2.4"]
imessage = ["beautifulsoup4>=4.12", "lxml>=5.0"]  # HTML exports; chat.db + live bot are stdlib
instagram = ["instagrapi>=2.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
charliegpt = "charliegpt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charliegpt"]

[tool.uv]
# Applied to every resolve (with or without extras), so a plain `uv run` can't undo them on Linux:
# vLLM 0.11 / Unsloth break on transformers 5.x, and numba (used by vLLM) supports numpy <= 2.2.
constraint-dependencies = ["transformers<5; sys_platform == 'linux'", "numpy<2.3; sys_platform == 'linux'"]
# cuda and mlx stacks never coexist; resolve them separately.
conflicts = [[{ extra = "cuda" }, { extra = "mlx" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
